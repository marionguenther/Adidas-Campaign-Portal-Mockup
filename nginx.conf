# Frontend nginx config — serves the Angular SPA + proxies /api and /auth to the BFF.
# In OpenShift, the BFF is reachable via the in-cluster service DNS name set
# through the BFF_UPSTREAM env var (defaulted via configmap, see deployment.yaml).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck for the readiness/liveness probes.
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # BFF API proxy. The upstream name is rewritten at container start (see
    # entrypoint) so the same image works in dev, staging and prod.
    location ~ ^/(api|auth)/ {
        proxy_pass http://wf-planning-bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
        proxy_redirect off;
    }

    # SPA fallback — every non-asset path returns index.html so Angular's
    # router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed bundles.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
